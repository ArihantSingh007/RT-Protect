name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows MSVC (${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add OpenSSL bin to PATH
        shell: powershell
        run: echo "${{ github.workspace }}/third_party/openssl/bin" >> $env:GITHUB_PATH

      - name: Configure CMake (Visual Studio 17 2022 x64)
        shell: powershell
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DOPENSSL_ROOT_DIR="${{ github.workspace }}/third_party/openssl" `
            -DRTPROTECT_BUILD_TESTS=ON

      - name: Build all targets
        shell: powershell
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Execute automated test suite
        shell: powershell
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Verify release packaging and SDK smoke test
        if: matrix.build_type == 'Release'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tooling/package_release.ps1 -BuildDir build -OpenSslDir "${{ github.workspace }}/third_party/openssl"

      - name: Archive release packages and checksums
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: rtprotect-windows-x64-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  windows-mingw-ninja:
    name: Windows MinGW (GCC, Ninja, Release)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW-w64 and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja
          path-type: inherit

      - name: Add OpenSSL bin to PATH
        shell: powershell
        run: echo "${{ github.workspace }}/third_party/openssl/bin" >> $env:GITHUB_PATH

      - name: Configure CMake (MinGW GCC + Ninja)
        shell: powershell
        run: |
          cmake -B build-mingw -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_C_COMPILER=gcc `
            -DOPENSSL_ROOT_DIR="${{ github.workspace }}/third_party/openssl" `
            -DRTPROTECT_BUILD_TESTS=ON

      - name: Build all targets
        shell: powershell
        run: cmake --build build-mingw

      - name: Execute automated test suite
        shell: powershell
        run: ctest --test-dir build-mingw -C Release --output-on-failure
