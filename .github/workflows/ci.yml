name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows MSVC (${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add OpenSSL bin to PATH
        shell: powershell
        run: echo "${{ github.workspace }}/third_party/openssl/bin" >> $env:GITHUB_PATH

      - name: Configure CMake (Visual Studio 17 2022 x64)
        shell: powershell
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DOPENSSL_ROOT_DIR="${{ github.workspace }}/third_party/openssl" `
            -DRTPROTECT_BUILD_TESTS=ON

      - name: Build all targets
        shell: powershell
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Execute automated test suite
        shell: powershell
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Verify release packaging and SDK smoke test
        if: matrix.build_type == 'Release'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tooling/package_release.ps1 -BuildDir build -OpenSslDir "${{ github.workspace }}/third_party/openssl"

      - name: Archive release packages and checksums
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: rtprotect-windows-x64-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  windows-mingw-ninja:
    name: Windows MinGW (GCC, Ninja, Release)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW-w64 and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja
          path-type: inherit

      - name: Add OpenSSL bin to PATH
        shell: powershell
        run: echo "${{ github.workspace }}/third_party/openssl/bin" >> $env:GITHUB_PATH

      - name: Configure CMake (MinGW GCC + Ninja)
        shell: powershell
        run: |
          cmake -B build-mingw -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_C_COMPILER=gcc `
            -DOPENSSL_ROOT_DIR="${{ github.workspace }}/third_party/openssl" `
            -DRTPROTECT_BUILD_TESTS=ON

      - name: Build all targets
        shell: powershell
        run: cmake --build build-mingw

      - name: Execute automated test suite
        shell: powershell
        run: ctest --test-dir build-mingw -C Release --output-on-failure

  windows-clang-fuzzing:
    name: Windows Clang libFuzzer + ASan/UBSan
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: 1.11.1

      - name: Configure CMake (Clang + libFuzzer)
        shell: powershell
        run: |
          cmake -B build-fuzz -G Ninja `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_C_COMPILER=clang `
            -DOPENSSL_ROOT_DIR="${{ github.workspace }}/third_party/openssl" `
            -DRTPROTECT_BUILD_FUZZERS=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile libFuzzer targets
        shell: powershell
        run: |
          cmake --build build-fuzz --target fuzz_pe_protector fuzz_json_parser fuzz_manifest_deserialize fuzz_vm_deserialize_and_verify fuzz_encrypted_message_deserialize fuzz_source_scanner

      - name: Execute Fuzzers (Time-Bounded Smoke/Sanity Pass)
        shell: powershell
        run: |
          $asanDll = (Get-ChildItem -Path "C:\Program Files\LLVM" -Filter "clang_rt.asan_dynamic-x86_64.dll" -Recurse | Select-Object -First 1).DirectoryName
          $env:PATH = "$asanDll;${{ github.workspace }}/third_party/openssl/bin;$env:PATH"
          
          Write-Host "Running fuzz_pe_protector..."
          .\build-fuzz\fuzz\fuzz_pe_protector.exe -max_total_time=20
          
          Write-Host "Running fuzz_json_parser..."
          .\build-fuzz\fuzz\fuzz_json_parser.exe -max_total_time=20
          
          Write-Host "Running fuzz_manifest_deserialize..."
          .\build-fuzz\fuzz\fuzz_manifest_deserialize.exe -max_total_time=20
          
          Write-Host "Running fuzz_vm_deserialize_and_verify..."
          .\build-fuzz\fuzz\fuzz_vm_deserialize_and_verify.exe -max_total_time=20
          
          Write-Host "Running fuzz_encrypted_message_deserialize..."
          .\build-fuzz\fuzz\fuzz_encrypted_message_deserialize.exe -max_total_time=20
          
          Write-Host "Running fuzz_source_scanner..."
          .\build-fuzz\fuzz\fuzz_source_scanner.exe -max_total_time=20

