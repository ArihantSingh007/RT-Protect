name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-test:
    name: Windows (${{ matrix.generator }}, ${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
        generator: [ "Visual Studio 17 2022" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add OpenSSL bin to PATH
        shell: powershell
        run: echo "${{ github.workspace }}/third_party/openssl/bin" >> $env:GITHUB_PATH

      - name: Configure CMake (Visual Studio 17 2022 x64)
        shell: powershell
        run: |
          cmake -B build -G "${{ matrix.generator }}" -A x64 `
            -DOPENSSL_ROOT_DIR="${{ github.workspace }}/third_party/openssl" `
            -DRTPROTECT_BUILD_TESTS=ON

      - name: Build all targets
        shell: powershell
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Execute automated test suite
        shell: powershell
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Verify release packaging and SDK smoke test
        if: matrix.build_type == 'Release'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tooling/package_release.ps1 -BuildDir build -OpenSslDir "${{ github.workspace }}/third_party/openssl"

      - name: Archive release packages and checksums
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: rtprotect-windows-x64-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
