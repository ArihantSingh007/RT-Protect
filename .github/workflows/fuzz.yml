name: Fuzzing

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  libfuzzer-smoke-test:
    name: Clang libFuzzer Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Clang, LLVM, OpenSSL)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build clang libssl-dev

      - name: Configure CMake with Clang and Fuzzing Enabled
        run: |
          cmake -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DRTPROTECT_BUILD_FUZZERS=ON

      - name: Build all fuzz targets
        run: |
          cmake --build build-fuzz --target fuzz_manifest_deserialize
          cmake --build build-fuzz --target fuzz_vm_deserialize_and_verify
          cmake --build build-fuzz --target fuzz_encrypted_message_deserialize
          cmake --build build-fuzz --target fuzz_source_scanner

      - name: Smoke test fuzz_manifest_deserialize
        run: |
          ./build-fuzz/fuzz/fuzz_manifest_deserialize -max_total_time=30 -timeout=5

      - name: Smoke test fuzz_vm_deserialize_and_verify
        run: |
          ./build-fuzz/fuzz/fuzz_vm_deserialize_and_verify -max_total_time=30 -timeout=5

      - name: Smoke test fuzz_encrypted_message_deserialize
        run: |
          ./build-fuzz/fuzz/fuzz_encrypted_message_deserialize -max_total_time=30 -timeout=5

      - name: Smoke test fuzz_source_scanner
        run: |
          ./build-fuzz/fuzz/fuzz_source_scanner -max_total_time=30 -timeout=5
